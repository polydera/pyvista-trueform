[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvista-trueform"
version = "0.3.0"
description = "PyVista accessor for trueform: exact mesh booleans, arrangements, intersection curves, scalar-field cuts, and volume SDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.noncommercial" }
authors = [
  { name = "Ziga Sajovic", email = "info@polydera.com" },
  { name = "XLAB" },
]
keywords = [
  "pyvista",
  "mesh",
  "geometry",
  "mesh-boolean",
  "csg",
  "computational-geometry",
  "isosurface",
  "signed-distance-field",
  "nifti",
]
dependencies = [
  "trueform>=0.10.4",
  "pyvista>=0.48",
  "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."pyvista.accessors"]
trueform = "pyvista_trueform._accessor"

[project.urls]
Homepage = "https://trueform.polydera.com"
Repository = "https://github.com/polydera/pyvista-trueform"
Issues = "https://github.com/polydera/pyvista-trueform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyvista_trueform = ["_agents.md"]
